services:
  # Caddy: handles HTTPS + proxies traffic to the backend container
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - aicalling-net

  # Reset depends_on so backend doesn't wait for local postgres/redis
  backend:
    depends_on: !reset []
    environment:
      - ALLOWED_ORIGINS=https://ai-calling-seven.vercel.app,https://innvox.in,https://www.innvox.in

  # Reset depends_on so worker only waits for backend
  worker:
    depends_on: !reset
      backend:
        condition: service_healthy
    environment:
      - ALLOWED_ORIGINS=https://ai-calling-seven.vercel.app,https://innvox.in,https://www.innvox.in

  # Reset depends_on so ai-agent doesn't wait for local redis
  ai-agent:
    depends_on: !reset []

  # Disable local postgres — using Neon (managed cloud) instead
  postgres:
    profiles: ["disabled"]

  # Disable local redis — using Upstash (managed cloud) instead
  redis:
    profiles: ["disabled"]

  # Disable local frontend container — hosted on Vercel
  frontend:
    profiles: ["disabled"]

volumes:
  caddy_data:
